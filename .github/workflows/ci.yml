name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build, Typecheck and Test packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Check package boundaries
        run: pnpm depcruise

      - name: Typecheck packages
        run: pnpm -r --filter './packages/*' typecheck

      - name: Test packages
        run: pnpm -r --filter './packages/*' test

  # Gap guard (added 2026-07-25 after the 3.2.0 save-hardening debut shipped
  # with zero changelog record): any PR touching publishable package code must
  # carry a changeset, or the release notes silently lose it. Escape hatch for
  # intentionally-unpublished changes: `pnpm changeset --empty`.
  changeset-check:
    name: Require changeset for package changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changeset presence
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"

          # Publishable surface: package TS source (minus tests) and the Rust
          # Tauri plugin code. CHANGELOG/package.json/README edits, test-only
          # changes, and changeset-consumption (release) PRs never trigger this.
          SRC="$(echo "$CHANGED" | grep -E '^packages/[^/]+/(src|src-tauri)/' | grep -v '__tests__' || true)"
          if [ -z "$SRC" ]; then
            echo "No publishable package changes — changeset not required."
            exit 0
          fi

          CS="$(echo "$CHANGED" | grep -E '^\.changeset/[^/]+\.md$' | grep -v 'README\.md' || true)"
          if [ -z "$CS" ]; then
            echo "::error::This PR changes publishable package code but adds no changeset."
            echo "::error::Run 'pnpm changeset' and commit the generated file. If the change is"
            echo "::error::intentionally unpublished (refactor, internal tooling), run"
            echo "::error::'pnpm changeset --empty' instead — an empty changeset satisfies this check."
            echo "Changed publishable files:"
            echo "$SRC"
            exit 1
          fi

          echo "Changeset present:"
          echo "$CS"

  examples:
    name: Build & Typecheck example templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @overworld packages
        run: pnpm -r --filter './packages/*' build

      # Every example below ships a web/bundle build. This job gates every push
      # and PR on the templates still compiling. No native toolchains here — the
      # real desktop/mobile artifact builds live in build-artifacts.yml.
      - name: starter — build & typecheck
        run: |
          pnpm --filter starter build
          pnpm --filter starter typecheck

      - name: dungeon — build & typecheck
        run: |
          pnpm --filter dungeon build
          pnpm --filter dungeon typecheck

      - name: telegram-mini-app — build & typecheck
        run: |
          pnpm --filter telegram-mini-app build
          pnpm --filter telegram-mini-app typecheck

      # desktop-tauri: web build only (`build` = tsc --noEmit && vite build).
      # The native `tauri:build` runs in build-artifacts.yml, not here.
      - name: desktop-tauri (web) — build & typecheck
        run: |
          pnpm --filter desktop-tauri build
          pnpm --filter desktop-tauri typecheck

      # mobile-capacitor: web build only. The native android/iOS builds run in
      # build-artifacts.yml.
      - name: mobile-capacitor (web) — build & typecheck
        run: |
          pnpm --filter mobile-capacitor build
          pnpm --filter mobile-capacitor typecheck

      # weapp-game: `build` = node build.mjs (esbuild, which does NOT
      # type-check), so the separate typecheck step is load-bearing here.
      - name: weapp-game — build & typecheck
        run: |
          pnpm --filter weapp-game build
          pnpm --filter weapp-game typecheck

      - name: scene-authoring — build & typecheck
        run: |
          pnpm --filter scene-authoring build
          pnpm --filter scene-authoring typecheck

      - name: content-packs — build & typecheck
        run: |
          pnpm --filter content-packs build
          pnpm --filter content-packs typecheck

  docs:
    name: Check and build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Check docs content and types
        run: pnpm docs:check

      - name: Build docs
        run: pnpm docs:build

      - name: Check generated SEO output
        run: pnpm docs:seo
